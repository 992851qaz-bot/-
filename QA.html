    function checkStepValidity() {
      const steps = getSteps();
      const current = steps[currentStepIndex];
      if (!current) return true;

      switch (current.type) {
        case 'welcome':
          return true;
        case 'count':
          return state.analysisCount !== null;
        case 'device':
          return state.devices.length > 0;
        case 'purpose':
          return state.purposes.length > 0 || state.otherPurpose.trim().length > 0;
        case 'experience': {
          const uNeed = state.understandRating === 1 || state.understandRating === 2;
          const uOk = state.understandRating !== null && (!uNeed || state.understandDifficultyReason.trim().length > 0);
          const fNeed = state.findRating === 1 || state.findRating === 2;
          const fOk = state.findRating !== null && (!fNeed || state.findDifficultyReason.trim().length > 0);
          return uOk && fOk;
        }
        case 'usage': {
          const allAnswered = Object.keys(state.usage).length === usageFeatures.length;
          if (!allAnswered) return false;
          for (const feat of usageFeatures) {
            const v = state.usage[feat.id];
            if (v === 0 || v === 1) {
              const rList = state.usageReasons[feat.id] || [];
              if (rList.length === 0) return false;
            }
          }
          return true;
        }
        case 'dev_research': {
          const ocrNeed = state.ocrRating !== null && state.ocrRating < 5;
          const ocrOk = state.ocrRating !== null && (!ocrNeed || state.ocrFailReason.trim().length > 0);
          const waitNeed = state.waitRating !== null && state.waitRating < 5;
          const waitOk = state.waitRating !== null && (!waitNeed || state.waitMaxSeconds.trim().length > 0);
          const tierNeed = state.tierRating !== null && state.tierRating < 5;
          const tierOk = state.tierRating !== null && (!tierNeed || state.tierReason.trim().length > 0);
          return ocrOk && waitOk && tierOk;
        }
        case 'web_priorities':
          return state.webPriorities.length > 0 || state.otherWebPriority.trim().length > 0;
        case 'web_feedback':
          return true;
        case 'dc_community': {
          if (state.dcFrequency === null) return false;
          if (state.dcFrequency === 'freq_none') {
            return (state.dcNoFreqReason || []).length > 0;
          }
          return true;
        }
        case 'bot_awareness':
          if (state.botAwareness === null) return false;
          if (state.botAwareness === 'aware_not_used' || state.botAwareness === 'unaware') {
            return (state.botAwarenessReason || []).length > 0;
          }
          return true;
        case 'bot_survey':
          if (state.botRating === null) return false;
          if (state.botRating <= 3) {
            return state.botRatingReason.trim().length > 0;
          }
          return true;
        case 'bot_priorities':
          return state.botPriorities.length > 0 || state.otherBotPriority.trim().length > 0;
        case 'bot_feedback':
          return true;
        case 'final_cheer':
          return state.teamEncouragement.trim().length > 0;
        case 'finish':
          return true;
        default:
          return true;
      }
    }

    // 安全淨化函式：去除 Markdown 連結、惡意協定與特殊控制字元，防止釣魚與跳轉
    function sanitizeForDiscord(text) {
      if (!text) return '無';
      return String(text)
        .replace(/https?:\/\//gi, '[已過濾連結]//')
        .replace(/discord\.(gg|io|me|li)\//gi, '[已過濾邀請]/')
        .replace(/\[(.*?)\]\((.*?)\)/g, '$1 ($2)')
        .replace(/<@&?[0-9]+>/g, '[提及過濾]')
        .replace(/@(everyone|here)/g, '@已過濾')
        .replace(/[`_*{}\\]/g, ' ')
        .trim();
    }

    function setUsageInPlace(featId, val) {
      state.usage[featId] = val;
      const row = document.getElementById(`usage-row-${featId}`);
      if (!row) return;

      const buttons = row.querySelectorAll('.grid button');
      buttons.forEach((btn, idx) => {
        btn.className = 'px-3 py-2 rounded-xl text-xs sm:text-sm border transition bg-[#181C26] border-white/10 text-neutral-300 hover:text-white';
        if (idx === val) {
          if (val === 0) btn.className = 'px-3 py-2 rounded-xl text-xs sm:text-sm border transition bg-neutral-700 text-white border-neutral-500 font-bold shadow';
          if (val === 1) btn.className = 'px-3 py-2 rounded-xl text-xs sm:text-sm border transition bg-blue-600 text-white border-blue-400 font-bold shadow';
          if (val === 2) btn.className = 'px-3 py-2 rounded-xl text-xs sm:text-sm border transition bg-emerald-600 text-white border-emerald-400 font-bold shadow';
          if (val === 3) btn.className = 'px-3 py-2 rounded-xl text-xs sm:text-sm border transition bg-brand-gold text-black border-brand-gold font-bold shadow';
        }
      });

      const reasonBox = document.getElementById(`usage-reason-box-${featId}`);
      const ratingBox = document.getElementById(`usage-rating-box-${featId}`);

      if (val === 0 || val === 1) {
        if (reasonBox) {
          reasonBox.classList.remove('hidden');
          reasonBox.classList.add('block');
        }
        if (ratingBox) {
          ratingBox.classList.add('hidden');
          ratingBox.classList.remove('block');
          delete state.usageRatings[featId];
          delete state.usageRatingReasons[featId];
        }
      } else {
        if (reasonBox) {
          reasonBox.classList.add('hidden');
          reasonBox.classList.remove('block');
          delete state.usageReasons[featId];
        }
        if (ratingBox) {
          ratingBox.classList.remove('hidden');
          ratingBox.classList.add('block');
        }
      }
      updateNavButtons();

      }
      const box = document.getElementById(`usage-reason-box-${featId}`);
      if (box) {
        const btns = box.querySelectorAll('button');
        btns.forEach(btn => {
          const t = btn.innerText.replace('✓ ', '').trim();
          if (arr.includes(t)) {
            btn.className = 'px-3 py-1.5 rounded-lg border text-xs transition bg-amber-400 text-black border-amber-400 font-semibold shadow-sm';
            btn.innerText = `✓ ${t}`;
          } else {
            btn.className = 'px-3 py-1.5 rounded-lg border text-xs transition bg-white/5 border-white/10 text-neutral-300 hover:text-white';
            btn.innerText = t;
          }
        });
      }
      updateNavButtons();
    }

    function setUsageRating(featId, val) {
      state.usageRatings[featId] = val;
      const box = document.getElementById(`usage-rating-box-${featId}`);
      if (box) {
        const btns = box.querySelectorAll('.grid button');
        btns.forEach((btn, idx) => {
          const star = idx + 1;
          if (star === val) {
            btn.className = 'py-1.5 rounded-lg border text-xs transition font-mono bg-brand-gold text-black border-brand-gold font-bold shadow';
          } else {
            btn.className = 'py-1.5 rounded-lg border text-xs transition font-mono bg-white/5 border-white/10 text-neutral-300 hover:text-white';
          }
        });
        const lowBox = document.getElementById(`usage-low-rating-${featId}`);
        if (lowBox) {
          if (val <= 2) {
            lowBox.classList.remove('hidden');
            lowBox.classList.add('block');
          } else {
            lowBox.classList.add('hidden');
            lowBox.classList.remove('block');
            delete state.usageRatingReasons[featId];
          }
        }
      }
      updateNavButtons();
    }

    function appendUsageRatingReason(featId, text) {
      if (!state.usageRatingReasons[featId] || state.usageRatingReasons[featId].trim() === '') {
        state.usageRatingReasons[featId] = text;
      } else if (!state.usageRatingReasons[featId].includes(text)) {
        state.usageRatingReasons[featId] += `、${text}`;
      }
      const inputEl = document.getElementById(`inputUsageReason_${featId}`);
      if (inputEl) inputEl.value = state.usageRatingReasons[featId];
      updateNavButtons();
    }

    function toggleWebPriorityOrder(id) {
      if (id === 'w_none') {
        state.webPriorities = ['w_none'];
        renderStep();
        return;
      }
      const noneIdx = state.webPriorities.indexOf('w_none');
      if (noneIdx !== -1) {
        state.webPriorities.splice(noneIdx, 1);
      }
      const idx = state.webPriorities.indexOf(id);
      if (idx !== -1) {
        state.webPriorities.splice(idx, 1);
      } else {
        if (state.webPriorities.length >= 3) {
          showToast('⚠️ 最多選擇 3 項優先順序');
          return;
        }
        state.webPriorities.push(id);
      }
      renderStep();
    }

    function clearWebPriorities() {
      state.webPriorities = [];
      renderStep();
    }

    function selectDcFrequency(id) {
      state.dcFrequency = id;
      renderStep();
    }

    function toggleDcNoFreqReason(reason) {
      if (!state.dcNoFreqReason) state.dcNoFreqReason = [];
      const idx = state.dcNoFreqReason.indexOf(reason);
      if (idx !== -1) {
        state.dcNoFreqReason.splice(idx, 1);
      } else {
        state.dcNoFreqReason.push(reason);
      }
      renderStep();
    }

    function setDcAspectRating(aspectId, star) {
      state.dcAspectRatings[aspectId] = star;
      renderStep();
    }

    function appendDcAspectReason(aspectId, text) {
      if (!state.dcAspectReasons[aspectId] || state.dcAspectReasons[aspectId].trim() === '') {
        state.dcAspectReasons[aspectId] = text;
      } else if (!state.dcAspectReasons[aspectId].includes(text)) {
        state.dcAspectReasons[aspectId] += `、${text}`;

      const inputEl = document.getElementById(`inputDcAspect_${aspectId}`);

    }

    function selectBotAwareness(id) {
      state.botAwareness = id;

    }

    function toggleBotAwarenessReason(reason) {
      if (!state.botAwarenessReason) state.botAwarenessReason = [];
      const idx = state.botAwarenessReason.indexOf(reason);
      if (idx !== -1) {
        state.botAwarenessReason.splice(idx, 1);
      } else {
        state.botAwarenessReason.push(reason);
      }
      renderStep();
    }

    function toggleBotCommandOrder(id) {
      const idx = state.botCommands.indexOf(id);
      if (idx !== -1) {
        state.botCommands.splice(idx, 1);
        delete state.botCommandRatings[id];
        delete state.botCommandRatingReasons[id];
      } else {
        state.botCommands.push(id);
      }
      renderStep();
    }

    function clearBotCommands() {
      state.botCommands = [];
      state.botCommandRatings = {};
      state.botCommandRatingReasons = {};
      renderStep();
    }

    function setBotCommandRating(cmdId, star) {
      state.botCommandRatings[cmdId] = star;
      const box = document.getElementById(`bot_cmd_rating_box_${cmdId}`);
      if (box) {
        const btns = box.querySelectorAll('.grid button');
        btns.forEach((btn, idx) => {
          const s = idx + 1;
          if (s === star) {
            btn.className = 'py-1.5 rounded-lg border text-xs transition font-mono bg-brand-gold text-black border-brand-gold font-bold shadow';
          } else {
            btn.className = 'py-1.5 rounded-lg border text-xs transition font-mono bg-white/5 border-white/10 text-neutral-300 hover:text-white';
          }
        });
        const lowBox = document.getElementById(`bot_cmd_low_box_${cmdId}`);
        if (lowBox) {
          if (star < 5) {
            lowBox.classList.remove('hidden');
            lowBox.classList.add('block');
          } else {
            lowBox.classList.add('hidden');
            lowBox.classList.remove('block');
            delete state.botCommandRatingReasons[cmdId];
          }
        }
      }
      updateNavButtons();
    }

    function appendBotCommandRatingReason(cmdId, text) {
      if (!state.botCommandRatingReasons[cmdId] || state.botCommandRatingReasons[cmdId].trim() === '') {
        state.botCommandRatingReasons[cmdId] = text;
      } else if (!state.botCommandRatingReasons[cmdId].includes(text)) {
        state.botCommandRatingReasons[cmdId] += `、${text}`;
      }
      const inputEl = document.getElementById(`inputBotCmdReason_${cmdId}`);
      if (inputEl) inputEl.value = state.botCommandRatingReasons[cmdId];
      updateNavButtons();
    }

    function setBotRating(val) {
      state.botRating = val;
      renderStep();
    }

    function toggleBotPriorityOrder(id) {
      if (id === 'b_none') {
        state.botPriorities = ['b_none'];
        renderStep();
        return;
      }
      const noneIdx = state.botPriorities.indexOf('b_none');

      }
      const idx = state.botPriorities.indexOf(id);

        }

      }

    function clearBotPriorities() {
      state.botPriorities = [];

    }

    function showPurposeDemo(id) {
      let item = purposeOptions.find(p => p.id === id) || usageFeatures.find(f => f.id === id);
      if (!item) return;

      document.getElementById('demoModalIcon').innerText = item.icon || '🔍';
      document.getElementById('demoModalTitle').innerText = item.label || item.name;
      document.getElementById('demoModalDesc').innerText = item.desc;

      const animBox = document.getElementById('demoModalAnimBox');
      let animHtml = '';

      switch (item.anim) {
        case 'ocr':
          animHtml = `
            <div class="anim-scan bg-[#12141A] p-4 rounded-xl border border-white/15 text-sm font-mono space-y-1.5">
              <div class="text-neutral-400">正在辨識截圖詞條...</div>
              <div class="text-brand-gold font-semibold">🎯 暴擊率 +10.5% (極品)</div>
              <div class="text-emerald-400 font-semibold">💥 暴擊傷害 +21.0% (MAX)</div>
            </div>
          `;
          break;
        case 'compare':
          animHtml = `
            <div class="grid grid-cols-2 gap-3 text-sm font-mono text-center">
              <div class="bg-[#12141A] p-3 rounded-xl border border-white/10">
                <div class="text-neutral-400">聲骸 A</div>
                <div class="text-white font-medium mt-1">評分: 78.5</div>
              </div>
              <div class="bg-brand-gold/15 p-3 rounded-xl border border-brand-gold/50">
                <div class="text-brand-gold font-semibold">聲骸 B (優)</div>
                <div class="text-brand-gold font-semibold mt-1">評分: 89.2 (+10.7)</div>
              </div>
            </div>
          `;
          break;
        case 'overview':
          animHtml = `
            <div class="space-y-2 text-sm">
              <div class="flex justify-between text-neutral-300"><span>全角色大畢業進度</span><span class="text-brand-gold font-mono font-semibold">92%</span></div>
              <div class="h-3 w-full bg-neutral-800 rounded-full overflow-hidden border border-white/10">
                <div class="h-full bg-gradient-to-r from-amber-400 to-brand-gold" style="animation: miniBar 2.5s ease-in-out infinite alternate;"></div>
              </div>
            </div>
          `;
          break;
        case 'dps':
          animHtml = `
            <div class="text-center space-y-1.5 text-sm font-mono">
              <div class="text-neutral-400">正在計算預期總傷害 (DPS)...</div>
              <div class="text-brand-gold font-semibold text-base">暴擊期望提升: +14.2%</div>
            </div>
          `;
          break;
        case 'matrix':
          animHtml = `
            <div class="flex items-center justify-around text-sm">
              <span class="px-3 py-1.5 rounded-xl bg-blue-500/20 text-blue-300 border border-blue-500/40 font-medium">主 C</span>
              <span class="text-neutral-400">➔</span>
              <span class="px-3 py-1.5 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-500/40 font-medium">副 C</span>
              <span class="text-neutral-400">➔</span>
              <span class="px-3 py-1.5 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-medium">輔助</span>
            </div>
          `;
          break;
        case 'rank':
          animHtml = `
            <div class="space-y-1 text-sm text-center font-mono">
              <div class="text-neutral-400">全服同角色練度比對</div>
              <div class="text-brand-gold font-bold text-base">超越 95% 玩家 (SSS 梯隊)</div>
            </div>
          `;
          break;
        case 'simulate':
          animHtml = `
            <div class="text-center space-y-1.5 text-sm font-mono">
              <div class="text-neutral-400">模擬開第 5 孔副詞條...</div>
              <div class="text-brand-gold font-semibold" style="animation: miniPulse 1.5s infinite;">獲得【暴擊傷害 21.0%】🎉</div>
            </div>
          `;
          break;
        case 'weights':
          animHtml = `
            <div class="space-y-1.5 text-sm font-mono">
              <div class="flex justify-between text-neutral-300"><span>暴擊率加權值</span><span class="text-brand-gold font-semibold">x 2.0</span></div>
              <div class="flex justify-between text-neutral-300"><span>共鳴效率加權值</span><span class="text-emerald-400 font-semibold">x 1.2</span></div>
            </div>
          `;
          break;
        case 'share':
          animHtml = `
            <div class="text-center py-3 bg-gradient-to-r from-brand-gold/15 via-purple-500/15 to-transparent rounded-xl border border-white/10 text-sm text-neutral-100">
              🖼️ 生成專屬社群卡片（支援手機長圖與 PC 寬圖）
            </div>
          `;
          break;
        default:
          animHtml = `<div class="text-sm text-neutral-400 text-center">無動畫預覽</div>`;
      }

      animBox.innerHTML = animHtml;
      document.getElementById('demoModal').classList.remove('hidden');
    }

    function closeDemoModal() {
      document.getElementById('demoModal').classList.add('hidden');
    }

    function openOverviewModal() {
      const content = document.getElementById('overviewContent');
      const text = buildSummaryText();
      content.innerHTML = text.split('\n').map(l => {
        if (l.startsWith('【')) return `<div class="font-bold text-brand-gold text-base border-b border-white/10 pb-1 mt-2">${l}</div>`;
        if (l.startsWith('•')) return `<div class="text-white font-medium">${l}</div>`;
        if (l.startsWith('  └') || l.startsWith('  -')) return `<div class="text-amber-300 text-xs pl-4">${l}</div>`;
        return `<div class="text-neutral-400 text-xs">${l}</div>`;
      }).join('');
      document.getElementById('overviewModal').classList.remove('hidden');
    }

    function closeOverviewModal() {
      document.getElementById('overviewModal').classList.add('hidden');
    }

    function buildSummaryText() {
      const getDeviceName = (id) => (deviceOptions.find(d => d.id === id) || {}).label || id;
      const getPurposeName = (id) => (purposeOptions.find(p => p.id === id) || {}).label || id;
      const getWebImproveName = (id) => (webImproveOptions.find(i => i.id === id) || {}).label || id;
      const getBotImproveName = (id) => (botImproveOptions.find(i => i.id === id) || {}).label || id;
      const getBotAwarenessName = (id) => (botAwarenessOptions.find(b => b.id === id) || {}).title || id;
      const getBotCmdName = (id) => (botCommandOptions.find(c => c.id === id) || {}).label || id;
      const getDcFreqName = (id) => (dcFrequencyOptions.find(f => f.id === id) || {}).title || id;
      const getDcAspectName = (id) => (discordAspects.find(a => a.id === id) || {}).name || id;

      return [
        '【GAME ZH 聲骸分析儀、DC社群與機器人完整調研報告】',
        `• 玩家族群：${state.persona || '未提供'} (分析過 ${state.analysisCount || '0'} 筆)`,
        `• 常用裝置排序：${state.devices.map((id, idx) => `[${idx + 1}]${getDeviceName(id)}`).join(' ➔ ') || '未選'}`,
        `• 核心目的優先序：${state.purposes.map((id, idx) => `[${idx + 1}]${getPurposeName(id)}`).join('、') || '無'}`,
        state.otherPurpose ? `• 自訂目的補充：${state.otherPurpose}` : null,
        `• 核心用途易懂度：${state.understandRating !== null ? state.understandRating + '/5' : '未評估'}`,
        state.understandDifficultyReason ? `  └ 困難原因：${state.understandDifficultyReason}` : null,
        `• 工具切換易找度：${state.findRating !== null ? state.findRating + '/5' : '未評估'}`,
        state.findDifficultyReason ? `  └ 困難原因：${state.findDifficultyReason}` : null,
        `• 網站模組使用頻率與細節：`,
        ...Object.entries(state.usage).map(([k, v]) => {
          const reasons = state.usageReasons[k] && state.usageReasons[k].length ? ` (未用原因: ${state.usageReasons[k].join('、')})` : '';
          const rating = state.usageRatings[k] ? ` (滿意度: ${state.usageRatings[k]}分)` : '';
          const ratingReason = state.usageRatingReasons[k] ? ` (低分原因: ${state.usageRatingReasons[k]})` : '';
          return `  - ${k}: ${['沒用過', '知道未用', '偶爾用', '常用'][v]}${reasons}${rating}${ratingReason}`;
        }),
        `• OCR 準確率滿意度：${state.ocrRating !== null ? state.ocrRating + '/5' : '未評估'}`,
        state.ocrFailReason ? `  └ 常見失誤：${state.ocrFailReason}` : null,
        `• 載入速度耐受度：${state.waitRating !== null ? state.waitRating + '/5' : '未評估'}`,
        state.waitMaxSeconds ? `  └ 可接受秒數/建議：${state.waitMaxSeconds}` : null,
        `• 評分級距合理度：${state.tierRating !== null ? state.tierRating + '/5' : '未評估'}`,
        state.tierReason ? `  └ 不合理原因：${state.tierReason}` : null,
        `• 網站端優先改善重點：${state.webPriorities.map((id, idx) => `[${idx + 1}]${getWebImproveName(id)}`).join('、') || '無'}`,
        state.otherWebPriority ? `• 網站端其他優先補充：${state.otherWebPriority}` : null,
        state.webPainPoint.trim() ? `• 網站常遇卡關點：${state.webPainPoint.trim()}` : null,
        state.webSuggestion.trim() ? `• 網站功能建議：${state.webSuggestion.trim()}` : null,
        `• Discord 社群造訪頻率：${state.dcFrequency ? getDcFreqName(state.dcFrequency) : '未填'}`,
        state.dcNoFreqReason && state.dcNoFreqReason.length ? `  └ 未活躍原因：${state.dcNoFreqReason.join('、')}` : null,
        state.dcFrequency && state.dcFrequency !== 'freq_none' ? `• Discord 社群機制評估：` : null,
        ...(state.dcFrequency && state.dcFrequency !== 'freq_none' ? Object.entries(state.dcAspectRatings).map(([k, v]) => {
          const reason = state.dcAspectReasons[k] ? ` (原因: ${state.dcAspectReasons[k]})` : '';
          return `  - ${getDcAspectName(k)}: ${v}分${reason}`;
        }) : []),
        state.dcSponsorIntent.trim() ? `• 社群贊助意願與看法：${state.dcSponsorIntent.trim()}` : null,
        state.dcCommunitySuggestion.trim() ? `• 社群運作與活動建議：${state.dcCommunitySuggestion.trim()}` : null,
        `• Discord 機器人經驗：${state.botAwareness ? getBotAwarenessName(state.botAwareness) : '未填'}`,
        state.botAwarenessReason && state.botAwarenessReason.length ? `  └ 未使用/不知道原因：${state.botAwarenessReason.join('、')}` : null,
        state.botCommands.length ? `• 常用機器人指令優先序與評分：` : null,
        ...state.botCommands.map((id, idx) => {
          const rating = state.botCommandRatings[id] ? ` [${state.botCommandRatings[id]}分]` : ' [未評分]';
          const reason = state.botCommandRatingReasons[id] ? ` (原因: ${state.botCommandRatingReasons[id]})` : '';
          return `  - [${idx + 1}] ${getBotCmdName(id)}${rating}${reason}`;
        }),
        state.botRating !== null ? `• 機器人整體滿意度：${state.botRating}/5` : null,
        state.botRatingReason ? `  └ 不滿意/普通原因：${state.botRatingReason}` : null,
        state.botPriorities.length ? `• 機器人端優先改善重點：${state.botPriorities.map((id, idx) => `[${idx + 1}]${getBotImproveName(id)}`).join('、')}` : null,
        state.otherBotPriority ? `• 機器人端其他優先補充：${state.otherBotPriority}` : null,
        state.botPainPoint.trim() ? `• 機器人常遇卡關點：${state.botPainPoint.trim()}` : null,
        state.botSuggestion.trim() ? `• 機器人功能建議：${state.botSuggestion.trim()}` : null,
        state.communitySuggestions.trim() ? `• 對社群總體建議與看法：${state.communitySuggestions.trim()}` : null,
        state.teamEncouragement.trim() ? `• 給開發團隊的正能量鼓勵：${state.teamEncouragement.trim()}` : null,
        `• 填寫時間：${new Date().toLocaleString('zh-TW')}`
      ].filter(Boolean).join('\n');
    }

    function copyResult() {
      const text = buildSummaryText();
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('✅ 摘要已複製至剪貼簿！');
      } catch (err) {
        showToast('❌ 複製失敗，請手動複製');
      }
      document.body.removeChild(ta);
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      const text = document.getElementById('toastMsg');
      text.innerText = msg;
      box.classList.remove('opacity-0', '-translate-y-2');
      box.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        box.classList.remove('opacity-100', 'translate-y-0');
        box.classList.add('opacity-0', '-translate-y-2');
      }, 2600);
    }

    renderStep();
  </script>
</body>
