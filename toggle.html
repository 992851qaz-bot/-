<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>晝夜像素開關</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
  /* 軌道顏色可平滑過渡（面積小，重繪成本低） */
  @property --track-a { syntax: "<color>"; inherits: true; initial-value: #e3e1dd; }
  @property --track-b { syntax: "<color>"; inherits: true; initial-value: #f3f2ef; }

  /* Layout: 單一開關置中於受光的平面上，光源來自滑塊本身 */
  :root {
    --font-pixel: "Silkscreen", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --font-body: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;

    /* 固定材質：兩種主題都定義在這裡，用 --light-on 交叉淡入淡出（只動 opacity，GPU 合成） */
    --sun-ink: #2b2622;
    --moon-ink: #f3f5ff;
    --moon-halo: #b4bfff;
    --sun-rim: #ffbf1f;
    --sun-glow: rgba(255, 166, 0, .8);
    --moon-rim: #c3cbff;
    --moon-glow: rgba(110, 120, 255, .9);
    --sun-face: linear-gradient(180deg, #ffc531 0%, #ffe08c 16%, #fbf1dc 44%, #f2f0ec 100%);
    --sun-face-shade: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -8px 14px -6px rgba(0,0,0,.08);
    --moon-face: linear-gradient(180deg, #5b5e6b 0%, #34363f 38%, #2b2e45 74%, #8e98ff 100%);
    --moon-face-shade: inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.07), inset 0 -10px 18px -8px rgba(200,208,255,.95);
    --sun-shadow: 0 -10px 34px -4px rgba(255,176,20,.55), 0 12px 18px -6px rgba(60,40,0,.25);
    --moon-shadow: 0 14px 38px -2px rgba(104,116,255,.6), 0 4px 10px rgba(0,0,0,.55);
    --day-sky: radial-gradient(120% 90% at 50% 45%, #f3f1ee, #cfccc7);
    --night-sky: radial-gradient(120% 90% at 50% 45%, #262833, #06070a);
    --day-amb: radial-gradient(closest-side, rgba(255,186,48,.32), transparent);
    --night-amb: radial-gradient(closest-side, rgba(96,108,255,.28), transparent);

    /* 淺色主題（預設） */
    --bg: #e4e1dd;
    --track-a: #e3e1dd;
    --track-b: #f3f2ef;
    --track-shadow:
      inset 0 2px 6px rgba(0,0,0,.10),
      inset 0 -1px 1px rgba(255,255,255,.9),
      0 18px 30px -10px rgba(0,0,0,.25),
      0 1px 2px rgba(0,0,0,.06);
    --text: #6b655d;
    --text-strong: #2b2622;
    --focus: #d08a00;
    --pos: 1;       /* 1 = 滑塊在右（白天） */
    --light-on: 1;  /* 1 = 白天材質 */

    --dur: .9s;
    --glide: cubic-bezier(.65, 0, .25, 1);   /* 慢起慢停，無回彈 */
    transition: --track-a var(--dur) ease, --track-b var(--dur) ease;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101116;
      --track-a: #040507;
      --track-b: #121319;
      --track-shadow:
        inset 0 3px 10px rgba(0,0,0,.95),
        inset 0 -1px 1px rgba(255,255,255,.06),
        0 18px 34px -10px rgba(0,0,0,.7),
        0 0 0 1px rgba(255,255,255,.04);
      --text: #8b90a8;
      --text-strong: #e9ebff;
      --focus: #9aa4ff;
      --pos: 0;
      --light-on: 0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101116;
    --track-a: #040507;
    --track-b: #121319;
    --track-shadow:
      inset 0 3px 10px rgba(0,0,0,.95),
      inset 0 -1px 1px rgba(255,255,255,.06),
      0 18px 34px -10px rgba(0,0,0,.7),
      0 0 0 1px rgba(255,255,255,.04);
    --text: #8b90a8;
    --text-strong: #e9ebff;
    --focus: #9aa4ff;
    --pos: 0;
    --light-on: 0;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
  }

  /* 背景：兩層天空交叉淡化，不重繪漸層 */
  .sky { position: fixed; inset: 0; pointer-events: none; transition: opacity var(--dur) ease; }
  .sky.day   { background: var(--day-sky); }
  .sky.night { background: var(--night-sky); opacity: calc(1 - var(--light-on)); }

  main {
    position: relative;
    min-height: 100%;
    box-sizing: border-box;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 44px;
    padding-block: 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow: clip;
  }

  /* ---------- 開關尺寸 ---------- */
  .stage {
    --w: min(380px, 78vw);
    --h: calc(var(--w) * .52);
    --pad: calc(var(--h) * .055);
    --tw: calc(var(--w) * .5);
    --th: calc(var(--h) - 2 * var(--pad));
    --r: calc(var(--th) * .27);
    --travel: calc(var(--w) - var(--tw) - 2 * var(--pad));
    position: relative;
    width: var(--w);
    height: var(--h);
  }

  /* 跟著滑塊移動的環境光 */
  .ambient {
    position: absolute;
    width: calc(var(--w) * 1.5);
    aspect-ratio: 1;
    left: calc(var(--pad) + var(--tw) / 2 - var(--w) * .75);
    top: calc(var(--h) / 2 - var(--w) * .75);
    transform: translateX(calc(var(--pos) * var(--travel)));
    pointer-events: none;
    will-change: transform, opacity;
    transition: transform var(--dur) var(--glide), opacity var(--dur) ease;
  }
  .ambient.day   { background: var(--day-amb);   opacity: var(--light-on); }
  .ambient.night { background: var(--night-amb); opacity: calc(1 - var(--light-on)); }

  .switch {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    border-radius: calc(var(--h) * .28);
    background: linear-gradient(180deg, var(--track-a), var(--track-b));
    box-shadow: var(--track-shadow);
    cursor: pointer;
    touch-action: pan-y;
    -webkit-tap-highlight-color: transparent;
    transition: box-shadow var(--dur) ease;
  }
  .switch:focus-visible { outline: 2px solid var(--focus); outline-offset: 6px; }

  .thumb {
    position: absolute;
    top: var(--pad);
    left: var(--pad);
    width: var(--tw);
    height: var(--th);
    transform: translateX(calc(var(--pos) * var(--travel)));
    will-change: transform;
    transition: transform var(--dur) var(--glide);
  }

  .thumb-body {
    display: block;
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: var(--r);
    will-change: transform;
    transition: scale .2s ease;
  }
  .switch:active .thumb-body { scale: .97; }
  .thumb-body.squish { animation: squish var(--dur) var(--glide); }
  @keyframes squish {
    0%   { transform: scale(1, 1); }
    45%  { transform: scale(1.07, .95); }
    100% { transform: scale(1, 1); }
  }

  .face, .rim, .shadow { position: absolute; pointer-events: none; transition: opacity var(--dur) ease; }
  .face, .shadow { inset: 0; border-radius: inherit; }
  .shadow.sun  { box-shadow: var(--sun-shadow);  opacity: var(--light-on); }
  .shadow.moon { box-shadow: var(--moon-shadow); opacity: calc(1 - var(--light-on)); }
  .face.sun  { background: var(--sun-face);  box-shadow: var(--sun-face-shade);  opacity: var(--light-on); }
  .face.moon { background: var(--moon-face); box-shadow: var(--moon-face-shade); opacity: calc(1 - var(--light-on)); }

  /* 發光邊框：白天在上緣、夜晚在下緣 */
  .rim { border: 3px solid transparent; }
  .rim.sun {
    inset: -4px;
    border-radius: calc(var(--r) + 4px);
    border-top-color: var(--sun-rim);
    filter: drop-shadow(0 0 3px var(--sun-rim)) drop-shadow(0 -3px 10px var(--sun-glow));
    opacity: var(--light-on);
  }
  .rim.moon {
    inset: -2px;
    border-radius: calc(var(--r) + 2px);
    border-bottom-color: var(--moon-rim);
    filter: drop-shadow(0 0 4px var(--moon-rim)) drop-shadow(0 5px 12px var(--moon-glow));
    opacity: calc(1 - var(--light-on));
  }

  .thumb canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: inherit;
  }

  /* ---------- 文字 ---------- */
  .caption { position: relative; display: grid; justify-items: center; gap: 10px; text-align: center; }
  .mode {
    margin: 0;
    font-family: var(--font-pixel);
    font-size: 14px;
    letter-spacing: .24em;
    color: var(--text-strong);
    transition: color var(--dur) ease;
  }
  .hint { margin: 0; font-size: 13px; line-height: 1.6; color: var(--text); transition: color var(--dur) ease; }
  kbd {
    font-family: var(--font-pixel);
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid currentColor;
    opacity: .8;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="sky day" aria-hidden="true"></div>
<div class="sky night" aria-hidden="true"></div>
<main>
  <div class="stage">
    <div class="ambient day" aria-hidden="true"></div>
    <div class="ambient night" aria-hidden="true"></div>
    <button class="switch" id="theme-switch" type="button" role="switch" aria-checked="false" aria-label="深色模式">
      <span class="thumb" aria-hidden="true">
        <span class="thumb-body">
          <span class="shadow sun"></span>
          <span class="shadow moon"></span>
          <span class="face sun"></span>
          <span class="face moon"></span>
          <span class="rim sun"></span>
          <span class="rim moon"></span>
          <canvas></canvas>
        </span>
      </span>
    </button>
  </div>
  <div class="caption">
    <p class="mode" id="mode-label" aria-live="polite">LIGHT MODE</p>
    <p class="hint">點一下、左右滑動，或按 <kbd>Space</kbd> 切換</p>
  </div>
</main>

<script>
(() => {
  const root = document.documentElement;
  const btn = document.getElementById('theme-switch');
  const body = btn.querySelector('.thumb-body');
  const canvas = btn.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const modeEl = document.getElementById('mode-label');
  const mqDark = matchMedia('(prefers-color-scheme: dark)');
  const mqReduce = matchMedia('(prefers-reduced-motion: reduce)');

  /* ---------- 像素圖示（17×17 格） ---------- */
  const N = 17, C = 8;
  const TAU = Math.PI * 2;
  const hash = (x, y) => { const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return s - Math.floor(s); };

  function sunPixels() {
    const px = [], seen = new Set();
    const add = (x, y, a) => { const k = x + ',' + y; if (!seen.has(k)) { seen.add(k); px.push({ x, y, a }); } };
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      if (Math.hypot(x - C, y - C) <= 3.3) add(x, y, 1);
    }
    for (let k = 0; k < 8; k++) {
      const ang = k * Math.PI / 4;
      for (const d of [5.6, 6.6]) add(Math.round(C + Math.cos(ang) * d), Math.round(C + Math.sin(ang) * d), .9);
    }
    return px;
  }

  function moonPixels() {
    const px = [];
    const cut = { x: 10.6, y: 5.6, r: 5.0 };
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      if (Math.hypot(x - C, y - C) > 6.2) continue;
      const dc = Math.hypot(x - cut.x, y - cut.y);
      if (dc < cut.r) continue;
      const h = hash(x, y);
      if (dc < cut.r + 1 && h < .3) continue;              // 內緣的像素抖動
      const shade = 1 - Math.max(0, x - 4) / 10;           // 左亮右暗
      px.push({ x, y, a: Math.max(.3, Math.min(1, shade)) * (.82 + .18 * h) });
    }
    // 星星
    [[13, 1, .75], [12, 2, .75], [13, 2, 1], [14, 2, .75], [13, 3, .75], [15, 5, .55], [11, 0, .45]]
      .forEach(([x, y, a]) => px.push({ x, y, a }));
    return px;
  }

  const SUN = sunPixels(), MOON = moonPixels();

  const css = name => getComputedStyle(root).getPropertyValue(name).trim();
  const toRgb = hex => {
    let h = (hex || '').replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const v = parseInt(h, 16);
    return Number.isNaN(v) ? [128, 128, 128] : [v >> 16 & 255, v >> 8 & 255, v & 255];
  };
  const INK = { sun: toRgb(css('--sun-ink') || '#2b2622'), moon: toRgb(css('--moon-ink') || '#f3f5ff') };
  const HALO = toRgb(css('--moon-halo') || '#b4bfff');

  /* ---------- 畫布 ---------- */
  let W = 0, H = 0, dpr = 1;
  let current = [];     // 目前畫面上的粒子
  let glow = 0;         // 0..1，夜晚圖示的微光強度
  let anim = null;

  function resize() {
    W = canvas.offsetWidth; H = canvas.offsetHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(W * dpr));
    canvas.height = Math.max(1, Math.round(H * dpr));
    draw(current, false);
  }

  /* trail = true 時保留上一格的殘影，讓旋轉看起來更連續 */
  function draw(list, trail) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (trail) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0,0,0,.42)';
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
    } else {
      ctx.clearRect(0, 0, W, H);
    }
    const box = Math.min(W, H) * .62, cell = box / N;
    const ox = (W - box) / 2, oy = (H - box) / 2;
    for (const p of list) {
      if (p.a <= .004) continue;
      const cx = ox + (p.x + .5) * cell, cy = oy + (p.y + .5) * cell;
      if (glow > .01) {                                   // 便宜的光暈：畫一個更大的淡方塊
        const g = cell * 1.7 * p.s;
        ctx.fillStyle = `rgba(${HALO[0]},${HALO[1]},${HALO[2]},${p.a * .16 * glow})`;
        ctx.fillRect(cx - g / 2, cy - g / 2, g, g);
      }
      const s = cell * .8 * p.s;
      ctx.fillStyle = `rgba(${p.c[0] | 0},${p.c[1] | 0},${p.c[2] | 0},${p.a})`;
      ctx.fillRect(cx - s / 2, cy - s / 2, s, s);
    }
  }

  const iconFor = dark => (dark ? MOON : SUN).map(p => ({ ...p, s: 1, c: dark ? INK.moon : INK.sun }));
  const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const clamp01 = t => t < 0 ? 0 : t > 1 ? 1 : t;
  const polar = p => ({ r: Math.hypot(p.x - C, p.y - C), f: Math.atan2(p.y - C, p.x - C) });
  const byAngle = (a, b) => polar(a).f - polar(b).f;
  const DUR = 1100, SPREAD = .14;

  /* 像素繞中心轉一整圈：散開成漩渦，再收攏成另一個圖示 */
  function morphTo(dark) {
    const target = iconFor(dark);
    const from = current.filter(p => p.a > .01).map(p => ({ ...p }));
    if (anim) cancelAnimationFrame(anim.raf);
    if (mqReduce.matches || !from.length) {
      anim = null; current = target; glow = dark ? 1 : 0; draw(current, false); return;
    }

    // 依角度排序後一一配對，粒子會沿同一方向流動而不是亂飛
    from.sort(byAngle); target.sort(byAngle);
    const n = Math.max(from.length, target.length);
    const usedA = new Set(), usedB = new Set();
    const dir = dark ? -1 : 1;                 // 往右（白天）順時針，往左（夜晚）逆時針，像滾動
    const glow0 = glow, glow1 = dark ? 1 : 0;
    const parts = [];
    for (let i = 0; i < n; i++) {
      const ia = Math.floor(i * from.length / n), ib = Math.floor(i * target.length / n);
      const a = { ...from[ia] }, b = { ...target[ib] };
      if (usedA.has(ia)) a.a = 0; else usedA.add(ia);    // 重複的起點從透明長出來
      if (usedB.has(ib)) b.a = 0; else usedB.add(ib);    // 重複的終點淡出
      const pa = polar(a), pb = polar(b);
      let df = pb.f - pa.f;
      if (df > Math.PI) df -= TAU; else if (df < -Math.PI) df += TAU;
      parts.push({
        a, b, ra: pa.r, rb: pb.r, fa: pa.f, df,
        bulge: 1.2 + Math.random() * 2.6,
        d: (i / n) * SPREAD,                    // 沿著角度依序出發，形成流動的尾巴
      });
    }

    const start = performance.now();
    const step = now => {
      const T = clamp01((now - start) / DUR);
      current = parts.map(({ a, b, ra, rb, fa, df, bulge, d }) => {
        const e = easeInOut(clamp01((T - d) / (1 - SPREAD)));
        const r = ra + (rb - ra) * e + bulge * Math.sin(Math.PI * e);
        const f = fa + df * e + dir * TAU * e;
        return {
          x: C + r * Math.cos(f),
          y: C + r * Math.sin(f),
          a: a.a + (b.a - a.a) * e,
          s: 1 - .3 * Math.sin(Math.PI * e),
          c: [0, 1, 2].map(k => a.c[k] + (b.c[k] - a.c[k]) * e),
        };
      });
      glow = glow0 + (glow1 - glow0) * easeInOut(T);
      if (T < 1) {
        draw(current, true);
        anim.raf = requestAnimationFrame(step);
      } else {
        current = current.filter(p => p.a > .01);
        anim = null;
        draw(current, false);
      }
    };
    anim = { raf: requestAnimationFrame(step) };
  }

  /* ---------- 主題狀態 ---------- */
  const isDark = () => {
    const t = root.getAttribute('data-theme');
    return t ? t === 'dark' : mqDark.matches;
  };
  let shown = isDark();

  function renderLabel(dark) {
    btn.setAttribute('aria-checked', String(dark));
    modeEl.textContent = dark ? 'DARK MODE' : 'LIGHT MODE';
  }

  function squish() {
    if (mqReduce.matches) return;
    body.classList.remove('squish');
    void body.offsetWidth;
    body.classList.add('squish');
  }
  body.addEventListener('animationend', () => body.classList.remove('squish'));

  function sync() {
    const dark = isDark();
    if (dark === shown) return;
    shown = dark;
    renderLabel(dark);
    squish();
    morphTo(dark);
  }

  const setTheme = dark => root.setAttribute('data-theme', dark ? 'dark' : 'light');

  /* 點擊 / 鍵盤（button 會把 Enter、Space 轉成 click） */
  let suppressClick = false;
  btn.addEventListener('click', () => {
    if (suppressClick) { suppressClick = false; return; }
    setTheme(!isDark());
  });

  /* 左右滑動：往左 = 夜晚，往右 = 白天 */
  let dragX = null;
  btn.addEventListener('pointerdown', e => { dragX = e.clientX; });
  window.addEventListener('pointerup', e => {
    if (dragX === null) return;
    const dx = e.clientX - dragX;
    dragX = null;
    if (Math.abs(dx) > 24) {
      suppressClick = true;
      setTimeout(() => { suppressClick = false; }, 0);
      setTheme(dx < 0);
    }
  });
  window.addEventListener('pointercancel', () => { dragX = null; });

  new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  mqDark.addEventListener('change', sync);

  renderLabel(shown);
  glow = shown ? 1 : 0;
  current = iconFor(shown);
  new ResizeObserver(resize).observe(canvas);
  resize();
})();
</script>
</body>
</html>
