<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GAMEZH 鳴潮工具箱</title>
  <meta name="description" content="GAMEZH 鳴潮工具入口：聲骸分析儀、累充 CP 值計算、直播辨識 HUD、意見回饋。">
  <meta name="theme-color" content="#0f0f14">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GAMEZH">
  <meta property="og:title" content="GAMEZH 鳴潮工具箱">
  <meta property="og:description" content="聲骸分析、累充計算、直播 HUD，一站進入。">
  <meta property="og:image" content="icons/icon-512.png">
  <style>
    :root {
      --bg: #0f0f14;
      --surface: #17171f;
      --surface-2: #1f1f2a;
      --border: #2a2a37;
      --text: #ececf1;
      --muted: #9a9aab;
      --cyan: #38bdf8;
      --gold: #facc15;
      --radius: 18px;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      overscroll-behavior-y: none;
    }
    a { color: inherit; text-decoration: none; }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: calc(12px + var(--safe-t)) calc(16px + var(--safe-r)) calc(28px + var(--safe-b)) calc(16px + var(--safe-l));
    }

    /* Top bar */
    .top {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 12px;
      margin: calc(-12px - var(--safe-t)) calc(-16px - var(--safe-r)) 8px calc(-16px - var(--safe-l));
      padding: calc(10px + var(--safe-t)) calc(16px + var(--safe-r)) 10px calc(16px + var(--safe-l));
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid transparent;
      transition: border-color .2s;
    }
    .top.scrolled { border-bottom-color: var(--border); }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .brand img { width: 36px; height: 36px; border-radius: 10px; flex: none; }
    .brand b { font-size: 17px; letter-spacing: .02em; white-space: nowrap; }
    .brand small { display: block; color: var(--muted); font-size: 12px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 40px; padding: 0 14px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
      font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .btn.primary { background: var(--cyan); border-color: var(--cyan); color: #04131c; }
    .btn[hidden] { display: none; }

    /* Hero */
    .hero {
      position: relative; overflow: hidden;
      display: block; margin-top: 8px; padding: 22px 20px 20px;
      border-radius: calc(var(--radius) + 4px);
      background:
        radial-gradient(120% 90% at 100% 0%, rgba(56,189,248,.28), transparent 60%),
        radial-gradient(80% 80% at 0% 100%, rgba(250,204,21,.16), transparent 60%),
        var(--surface);
      border: 1px solid var(--border);
    }
    .hero .tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--gold); background: rgba(250,204,21,.12); padding: 3px 10px; border-radius: 999px; }
    .hero h1 { margin: 10px 0 6px; font-size: clamp(24px, 6.4vw, 34px); line-height: 1.2; }
    .hero p { margin: 0 0 16px; color: var(--muted); font-size: 15px; max-width: 34em; }
    .hero .btn { min-height: 48px; padding: 0 22px; font-size: 16px; }
    .hero .rings { position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; opacity: .25; pointer-events: none; }

    /* Sections */
    h2 { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .08em; margin: 26px 4px 10px; }
    .recent { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; scroll-snap-type: x mandatory; }
    .recent::-webkit-scrollbar { display: none; }
    .recent a { flex: none; scroll-snap-align: start; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 14px; }
    .recent .ico { width: 30px; height: 30px; font-size: 16px; border-radius: 50%; }

    .grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); } }

    .card {
      display: flex; align-items: center; gap: 14px;
      min-height: 76px; padding: 14px 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      transition: transform .12s, border-color .15s, background .15s;
    }
    .card:hover { border-color: #3a3a4a; background: var(--surface-2); }
    .card:active { transform: scale(.985); }
    .card:focus-visible, .btn:focus-visible, .recent a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .ico {
      flex: none; display: grid; place-items: center;
      width: 46px; height: 46px; border-radius: 14px; font-size: 22px;
      background: var(--c, rgba(56,189,248,.14));
    }
    .card .txt { min-width: 0; flex: 1; }
    .card b { display: block; font-size: 16px; }
    .card span { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 2px; }
    .card .badge { flex: none; font-style: normal; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgba(56,189,248,.14); color: var(--cyan); align-self: flex-start; }
    .card .chev { flex: none; color: #555566; font-size: 20px; }

    footer { margin-top: 30px; text-align: center; color: #6c6c7c; font-size: 12px; }
    footer a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }

    /* Toast / iOS install sheet */
    .sheet {
      position: fixed; left: 12px; right: 12px; bottom: calc(12px + var(--safe-b)); z-index: 20;
      max-width: 480px; margin: 0 auto; padding: 16px;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 12px 40px rgba(0,0,0,.5); font-size: 14px;
    }
    .sheet[hidden] { display: none; }
    .sheet p { margin: 0 0 12px; }
    .sheet .row { display: flex; gap: 8px; justify-content: flex-end; }
    .offline { display: none; margin-top: 10px; padding: 10px 14px; border-radius: 12px; background: rgba(250,204,21,.1); color: var(--gold); font-size: 13px; }
    body.is-offline .offline { display: block; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top" id="top">
      <a class="brand" href="portal.html" aria-label="GAMEZH 首頁">
        <img src="icons/icon-192.png" alt="">
        <div><b>GAMEZH</b><small>鳴潮工具箱</small></div>
      </a>
      <button class="btn primary" id="installBtn" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>安裝 App
      </button>
    </header>

    <div class="offline" role="status">目前離線中。入口頁可以開，但工具需要網路才能使用。</div>

    <a class="hero" href="20260828.html" data-tool="echo">
      <svg class="rings" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke-width="3"><circle cx="50" cy="50" r="46" stroke="#38bdf8"/><circle cx="50" cy="50" r="34" stroke="#38bdf8" opacity=".6"/><circle cx="50" cy="50" r="22" stroke="#facc15"/></g><circle cx="50" cy="50" r="8" fill="#facc15"/></svg>
      <span class="tag">主力工具</span>
      <h1>鳴潮聲骸分析儀</h1>
      <p>聲骸評分、Build 攻略與 DPS 試算。</p>
      <span class="btn primary">開始分析 →</span>
    </a>

    <section id="recentWrap" hidden>
      <h2>最近使用</h2>
      <div class="recent" id="recent"></div>
    </section>

    <h2>所有工具</h2>
    <nav class="grid" id="grid" aria-label="工具列表"></nav>

    <footer>
      <p>GAMEZH · 非官方玩家工具，與庫洛遊戲無關</p>
    </footer>
  </div>

  <div class="sheet" id="iosSheet" hidden role="dialog" aria-label="加入主畫面">
    <p><b>把 GAMEZH 加到主畫面</b><br>點 Safari 下方的「分享」<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M5 12v8h14v-8"/></svg>，再選「加入主畫面」。</p>
    <div class="row"><button class="btn" id="iosClose">知道了</button></div>
  </div>

  <script>
    // 工具清單：之後新增頁面只要改這裡
    var TOOLS = [
      { id: 'echo',   href: '20260828.html', icon: '🎯', title: '聲骸分析儀',       desc: '聲骸評分・Build 攻略・DPS 試算',  badge: '熱門', color: 'rgba(56,189,248,.14)' },
      { id: 'topup',  href: '3.7.html',      icon: '💎', title: '累充 CP 值計算',    desc: '累充累儲規劃與抽卡模擬',          color: 'rgba(250,204,21,.13)' },
      { id: 'live',   href: 'ON1.html',      icon: '📡', title: '直播即時辨識 HUD',  desc: '直播串流中即時辨識聲骸',          color: 'rgba(244,114,182,.13)' },
      { id: 'hud',    href: 'exe.html',      icon: '🖥️', title: 'HUD v2.1',          desc: '光學評分與面板紀錄',              color: 'rgba(167,139,250,.14)' },
      { id: 'qa',     href: 'QA.html',       icon: '💬', title: '意見回饋',          desc: '回報問題或提出建議',              color: 'rgba(74,222,128,.13)' }
    ];
    var byId = {};
    TOOLS.forEach(function (t) { byId[t.id] = t; });

    function el(tag, attrs, html) {
      var n = document.createElement(tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      if (html != null) n.innerHTML = html;
      return n;
    }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    // 工具卡片
    var grid = document.getElementById('grid');
    TOOLS.forEach(function (t) {
      var a = el('a', { class: 'card', href: t.href, 'data-tool': t.id },
        '<div class="ico" style="--c:' + t.color + '" aria-hidden="true">' + t.icon + '</div>' +
        '<div class="txt"><b>' + esc(t.title) + '</b><span>' + esc(t.desc) + '</span></div>' +
        (t.badge ? '<em class="badge">' + esc(t.badge) + '</em>' : '<span class="chev" aria-hidden="true">›</span>'));
      grid.appendChild(a);
    });

    // 最近使用（只存在這台裝置）
    var KEY = 'gamezh.portal.recent';
    function getRecent() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
    function pushRecent(id) {
      try {
        var list = getRecent().filter(function (x) { return x !== id; });
        list.unshift(id);
        localStorage.setItem(KEY, JSON.stringify(list.slice(0, 4)));
      } catch (e) {}
    }
    function renderRecent() {
      var list = getRecent().filter(function (id) { return byId[id]; });
      var wrap = document.getElementById('recentWrap'), box = document.getElementById('recent');
      box.innerHTML = '';
      wrap.hidden = list.length === 0;
      list.forEach(function (id) {
        var t = byId[id];
        box.appendChild(el('a', { href: t.href, 'data-tool': t.id },
          '<span class="ico" style="--c:' + t.color + '" aria-hidden="true">' + t.icon + '</span>' + esc(t.title)));
      });
    }
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('[data-tool]');
      if (a) pushRecent(a.getAttribute('data-tool'));
    });
    renderRecent();
    window.addEventListener('pageshow', renderRecent); // 從工具頁按返回時更新

    // 頂欄捲動陰影
    var topBar = document.getElementById('top');
    window.addEventListener('scroll', function () { topBar.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });

    // 離線提示
    function syncOnline() { document.body.classList.toggle('is-offline', !navigator.onLine); }
    window.addEventListener('online', syncOnline);
    window.addEventListener('offline', syncOnline);
    syncOnline();

    // 安裝成 App
    var installBtn = document.getElementById('installBtn');
    var deferred = null;
    var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferred = e;
      installBtn.hidden = false;
    });
    window.addEventListener('appinstalled', function () { installBtn.hidden = true; deferred = null; });
    if (isIOS && !standalone) installBtn.hidden = false;

    var sheet = document.getElementById('iosSheet');
    installBtn.addEventListener('click', function () {
      if (deferred) {
        deferred.prompt();
        deferred.userChoice.finally(function () { deferred = null; installBtn.hidden = true; });
      } else if (isIOS) {
        sheet.hidden = false;
      }
    });
    document.getElementById('iosClose').addEventListener('click', function () { sheet.hidden = true; });

    // Service worker：只快取入口頁本身，讓 App 能離線開啟
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});
      });
    }
  </script>
</body>
</html>
