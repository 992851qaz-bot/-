# 推送到 copilot/20260828 時自動部署到 Cloudflare Workers（https://www.992851qaz.workers.dev）
# 需要先在 GitHub repo 的 Settings → Secrets and variables → Actions 加入：
#   CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
# 還沒設定時這個工作會自動略過，不會失敗。
name: Deploy to Cloudflare Workers

on:
  push:
    branches: ["copilot/20260828"]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip (Cloudflare secrets not set)
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN 尚未設定，略過部署。"
      - name: Checkout
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
